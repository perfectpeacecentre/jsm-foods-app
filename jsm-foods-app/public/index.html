<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f5f3a">
  <title>JSM Foods</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN -->
  <section id="login-view" class="center">
    <form id="login-form" class="card narrow" autocomplete="off">
      <h1>JSM Foods</h1>
      <p class="muted">Sign in with your username and 4-digit PIN</p>
      <label>Username
        <input id="login-username" type="text" autocapitalize="none" autocorrect="off" required>
      </label>
      <label>PIN
        <input id="login-pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required>
      </label>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <!-- APP -->
  <section id="app-view" hidden>
    <header class="topbar">
      <div>
        <strong>JSM Foods</strong>
        <span id="who" class="muted"></span>
      </div>
      <button id="logout-btn" class="ghost">Sign out</button>
    </header>

    <nav class="tabs">
      <button data-tab="add" class="active">Add customer</button>
      <button data-tab="list">Customers</button>
      <button data-tab="users" id="users-tab" hidden>Staff</button>
    </nav>

    <main>
      <!-- ADD CUSTOMER -->
      <div id="tab-add" class="tab">
        <form id="customer-form" class="card">
          <h2>New customer record</h2>
          <label>Customer name
            <input name="name" type="text" required>
          </label>
          <label>Customer type
            <select name="type" required>
              <option value="">Select...</option>
              <option>Distributor</option>
              <option>Bakery</option>
            </select>
          </label>
          <div class="row">
            <label>State
              <select name="state" id="state-select" required></select>
            </label>
            <label>City / Town
              <input name="city" type="text" required>
            </label>
          </div>
          <label>Phone number
            <input name="phone" type="tel" inputmode="tel" placeholder="08012345678" required>
          </label>
          <label>Approx. bags of flour used per month
            <input name="flourBags" type="number" inputmode="numeric" min="0" step="1" required>
          </label>
          <label>Status
            <select name="status" required>
              <option value="">Select...</option>
              <option>Current</option>
              <option>Prospective</option>
              <option>Former</option>
              <option>Not interested</option>
            </select>
          </label>
          <fieldset>
            <legend>Products interested in buying</legend>
            <div id="product-boxes" class="checks"></div>
          </fieldset>
          <button type="submit">Save customer</button>
          <p id="customer-msg" class="muted" role="status"></p>
        </form>
      </div>

      <!-- CUSTOMER LIST -->
      <div id="tab-list" class="tab" hidden>
        <div class="card">
          <div class="filters">
            <input id="f-search" type="search" placeholder="Search name, city or phone">
            <select id="f-status"><option value="">All statuses</option></select>
            <select id="f-type">
              <option value="">All types</option>
              <option>Distributor</option>
              <option>Bakery</option>
            </select>
            <select id="f-state"><option value="">All states</option></select>
          </div>
          <p id="count" class="muted"></p>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th><th>Type</th><th>Location</th><th>Phone</th>
                  <th>Bags/mo</th><th>Status</th><th>Products</th><th>Added by</th><th></th>
                </tr>
              </thead>
              <tbody id="customer-rows"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- STAFF -->
      <div id="tab-users" class="tab" hidden>
        <form id="user-form" class="card" autocomplete="off">
          <h2>Add a staff login</h2>
          <label>Full name
            <input name="displayName" type="text" required>
          </label>
          <label>Username (letters/numbers only, no spaces)
            <input name="username" type="text" pattern="[a-zA-Z0-9._]{3,20}" autocapitalize="none" required>
          </label>
          <label>4-digit PIN
            <input name="pin" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required>
          </label>
          <label>Role
            <select name="role" required>
              <option value="sales">Sales</option>
              <option value="owner">Owner</option>
              <option value="admin">Admin</option>
            </select>
          </label>
          <button type="submit">Create login</button>
          <p id="user-msg" class="muted" role="status"></p>
        </form>
        <div class="card">
          <h2>Staff</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Active</th></tr></thead>
              <tbody id="user-rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
